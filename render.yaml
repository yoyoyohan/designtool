services:
  - type: web
    name: designtool
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: STAFF_KEY
        sync: false
    disk:
      name: logo-library
      mountPath: /var/data
      sizeGB: 1
