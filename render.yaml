services:
  - type: web
    name: designtool
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_DESK_EMAIL
        value: desk@sportsbusiness.local
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
